
{% extends 'index.html'%}   
  {% block word %}

  
  <div class="row justify-content-center" id="tabRow">        
    <div class="col-12 col-md-10 col-lg-8 mt-3">
<div class="row">
    <div class="col-12 py-5">
      <div class="card border-2">
        <div class="card-header">
          <h4 class="mb-0" align="center" lang="ta">
            சொற்கள் தேடுகை 
          </h4>
        </div> 
        
          <div class="row">
              <div class="col-12 col-md-8 text-center">
                 <input class="{{ status_n }}" style="margin: 10px 15px 15px 5px; width: 250px; height: 45px; font-size: 16px; text-align: center;" type="submit" value="சொற்கள் ({{ count_n }})" id="show1" name="res4" />             
                 <input class="{{ status_g }}" style="margin: 10px 15px 15px 5px; width: 250px; height: 45px; font-size: 16px; text-align: center;" type="submit" value="கிரந்த சொற்கள் ({{ count_g }})" id="show2" name="res3" />
              </div>
              <div class="col-12 col-md-4 text-center">
                      <input type="submit" name="download" id="show3" class="btn btn-sm btn-cl1" 
                        value="⬇" style="width: 40px; height: 40px; border-radius: 5px; margin-top: 15px;"/>
              </div>
          </div>
      <div class="card-body">
          <div class="container-sm">
            <div class="row" id="rwSr">
                {% for i in data %}
                <div class="col-12 col-sm-6 col-md-6 border-end border-secondary">
                    <ul class="list-group list-group-flush">
                      <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap">
                        <label lang="ta" class="fw-bold" style="word-break: break-word; white-space: normal; flex: 1;">{{ i.words }}</label>
                        <span class="badge text-bg-cl1 rounded-pill ms-2">
                          <button type="button" class="btn btn-sm btn-cl1" data-bs-toggle="modal" data-bs-target="#doG">
                            <i class="bi bi-google"></i>
                          </button>                     
                          <button type="button" class="btn btn-sm btn-cl1 ms-1 copy-btn" onclick="copyToClipboard(this, '{{ i.words }}')">
                            <i class="bi bi-clipboard"></i>
                          </button>
                        </span>
                      </li>                                        
                    </ul>
                </div>
                {% endfor %} 
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script > 
    function copyToClipboard(button, text) {
  navigator.clipboard.writeText(text).then(() => {
    button.innerHTML = '<i class="bi bi-check-lg"></i>'; // Change to tick icon
    setTimeout(() => {
      button.innerHTML = '<i class="bi bi-clipboard"></i>'; // Revert back after 2 sec
    }, 2000);
  }).catch(err => {
    console.error("Failed to copy text: ", err);
  });
}
    </script>

  {% endblock %}
